name: Pipeline Health Check

on:
  schedule:
    # Run twice daily at 00:00 and 12:00 UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run pipeline report & health diagnostics
        run: |
          python -m goldreel.cli report

      - name: Run security health audit
        run: |
          python -m goldreel.cli audit

      - name: Run subsystem failure drills
        run: |
          python -m goldreel.cli drills

