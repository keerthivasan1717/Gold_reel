name: Daily Make Pipeline

on:
  schedule:
    # 07:30 UTC = 1:00 PM IST (gives 5.5 hours buffer for YouTube processing before 6:30 PM IST release)
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no publishing)"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies & ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -e .

      - name: Security pre-run check
        run: |
          python -m goldreel.cli audit

      - name: Ingest open data
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python -m goldreel.cli ingest || true

      - name: Execute daily long video pipeline (landscape, ~165s)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m goldreel.cli make --format landscape --lane sports --no-voice --duration 165.0 --dry-run
          else
            python -m goldreel.cli make --format landscape --lane sports --no-voice --duration 165.0 --publish --no-dry-run
          fi

      - name: Execute daily short video pipeline (vertical, 45s)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m goldreel.cli make --format portrait --lane sports --duration 45.0 --dry-run
          else
            python -m goldreel.cli make --format portrait --lane sports --duration 45.0 --publish --no-dry-run
          fi

      - name: Commit and push updated state history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/publish_history.json state/topic_history.json state/analytics_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(pipeline): update publish and topic history [skip ci]"
            git push
          fi

      - name: Archive publication packages (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldreel-out-packages
          path: out/
          if-no-files-found: ignore
