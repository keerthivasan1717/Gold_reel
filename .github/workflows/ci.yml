name: CI Test & Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run test suite
        run: |
          pytest -v

      - name: Run security audit
        run: |
          python -m goldreel.cli audit

      - name: Run failure resilience drills
        run: |
          python -m goldreel.cli drills

      - name: Run 14-day simulation
        run: |
          python -m goldreel.cli simulation

