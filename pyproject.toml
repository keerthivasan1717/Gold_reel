[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "goldreel"
version = "0.1.0"
description = "Automated, headless data-to-video YouTube channel pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "GoldReel Maintainers" }
]
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "pillow>=10.3.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
goldreel = "goldreel.cli:app"

[tool.setuptools.packages.find]
include = ["goldreel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501", # Line length handled by formatter
]
